name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: |
          uv venv -p 3.12 .venv
          uv pip install -p .venv/bin/python -e ".[dev]"

      - name: Lint (ruff)
        run: .venv/bin/ruff check .

      - name: Train smoke model (needed by tests + docker image)
        run: .venv/bin/python train.py --model gbr --sample 3000

      - name: Tests (pytest)
        run: .venv/bin/python -m pytest

      - name: Docker build
        run: docker build -t car-price:ci .

      - name: Smoke test container
        run: |
          docker run -d --rm -p 8000:8000 --name car-price-ci car-price:ci
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health && break
            sleep 1
          done
          curl -sf http://localhost:8000/health | grep '"model_loaded":true'
          curl -sf -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"mileage":42000,"year_of_registration":2019,"standard_make":"BMW","standard_model":"3 Series","standard_colour":"Black","body_type":"Saloon","fuel_type":"Diesel"}' \
            | grep '"predicted_price"'
          docker stop car-price-ci
